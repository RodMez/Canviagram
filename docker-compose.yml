services:
  app:
    build: .
    image: canviagram:local
    ports:
      - "3000:3000"
    env_file: []
    environment:
      DATABASE_URL: "/data/canviagram.db"
      SESSION_SECRET: "${SESSION_SECRET:?required}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://openrouter.ai/api/v1}"
      AI_MODEL: "${AI_MODEL:-openrouter/free}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      LINK_CODE_TTL_SECONDS: "${LINK_CODE_TTL_SECONDS:-600}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      BREVO_SENDER_EMAIL: "${BREVO_SENDER_EMAIL:-}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      REMINDER_SWEEP_SECRET: "${REMINDER_SWEEP_SECRET:-}"
    volumes:
      - canviagram_data:/data
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  canviagram_data:
