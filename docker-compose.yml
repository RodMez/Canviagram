services:
  app:
    build: .
    image: canviagram:local
    ports:
      - "3000:3000"
    env_file: []
    environment:
      DATABASE_URL: "/data/canviagram.db"
      SESSION_SECRET: "${SESSION_SECRET:?required}"
    volumes:
      - canviagram_data:/data
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  canviagram_data:
